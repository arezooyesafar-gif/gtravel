<div class="cities-list">
    <ul class="country_menu">

        <li>
            <a href="#" class="back-to-main" onclick="backToHotelCountry(); return false;">
                بازگشت
            </a>
        </li>

        <li>
            <a href="{% url 'all-hotel-list' country.id country.slug %}"
               class="offcanvas-menu-link country-head">
                <span class="offcanvas-menu-title country-list">
                    هتل های {{ country.TitleC }}
                </span>
            </a>
        </li>

        {% for i in hotel_cities %}
            <li class="offcanvas-submenu_link">
                <a href="{% url 'all-hotel-city-list' i.id i.slug %}"
                   class="offcanvas-menu-link">
                    <span class="offcanvas-menu-title">هتل های {{ i.Name }}</span>
                    <span class="plus_menu"></span>
                </a>
            </li>
        {% endfor %}

    </ul>
</div>
