{% if tr_type %}
<div class="hbx-transfer hbx-transfer-{{ tr_type }}">
    <span class="hbx-transfer-line"></span>
    <span class="hbx-transfer-icon" title="{{ tr_label }}">
        {% if tr_type == 'bus' %}
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2" y="7.5" width="1.6" height="4" rx=".8" fill="currentColor"></rect>
                <rect x="20.4" y="7.5" width="1.6" height="4" rx=".8" fill="currentColor"></rect>
                <rect x="4" y="2" width="16" height="17" rx="3" fill="currentColor"></rect>
                <rect x="8.5" y="3.3" width="7" height="1.3" rx=".65" fill="#fff"></rect>
                <rect x="5.6" y="5.8" width="12.8" height="6.4" rx="1.2" fill="#fff"></rect>
                <circle cx="7.4" cy="15.4" r="1.3" fill="#fff"></circle>
                <circle cx="16.6" cy="15.4" r="1.3" fill="#fff"></circle>
                <rect x="10" y="14.8" width="4" height="1.2" rx=".6" fill="#fff"></rect>
                <rect x="5.5" y="18" width="3" height="4" rx="1" fill="currentColor"></rect>
                <rect x="15.5" y="18" width="3" height="4" rx="1" fill="currentColor"></rect>
            </svg>
        {% elif tr_type == 'train' %}
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 17.5 A2.5 2.5 0 0 1 4.5 15.2 V6.5 C4.5 3.5 8 1.8 12 1.8 S19.5 3.5 19.5 6.5 V15.2 A2.5 2.5 0 0 1 18 17.5 Z" fill="currentColor"></path>
                <rect x="9.5" y="3" width="5" height="1.2" rx=".6" fill="#fff"></rect>
                <rect x="6.3" y="5.6" width="11.4" height="5.6" rx="1.4" fill="#fff"></rect>
                <circle cx="8" cy="14.2" r="1.3" fill="#fff"></circle>
                <circle cx="16" cy="14.2" r="1.3" fill="#fff"></circle>
                <path d="M7.5 18.5 L5 22.5 M16.5 18.5 L19 22.5 M6.6 20.6 H17.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
            </svg>
        {% elif tr_type == 'flight' %}
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(180deg)">
                <path d="M21.5 15.8v-1.9l-8-5V3.4C13.5 2.6 12.8 1.8 12 1.8s-1.5.8-1.5 1.6v5.5l-8 5v1.9l8-2.5v5.4l-2.2 1.6v1.5L12 21l3.7 1.1v-1.5l-2.2-1.6v-5.4z" fill="currentColor"></path>
            </svg>
        {% elif tr_type == 'boat' %}
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.2 12 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
                <path d="M12.9 3.2 18 8.2 12.9 9.4 Z" fill="currentColor"></path>
                <path d="M4.2 11.8 H19.8 L17.4 17 H6.6 Z" fill="currentColor"></path>
                <path d="M2.6 19.4 C4.4 18.2 5.6 20.6 7.4 19.4 S10.6 18.2 12 19.4 S15.2 20.6 17 19.4 S20.2 18.2 21.4 19.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
            </svg>
        {% endif %}
    </span>
    <span class="hbx-transfer-sr">{{ tr_label }}</span>
    <span class="hbx-transfer-line"></span>
</div>
{% endif %}
