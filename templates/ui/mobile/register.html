<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'asset/css/mobile_login.css' %}">
    <link href="/static/asset/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <title>ثبت نام در سامانه ساتراپ </title>
</head>
<body style="background: #F3F5FA;">
<div class="col-lg-12">
    <div class="login_image_">
        <img src="/static/asset/css/images/login-img.png">
    </div>
</div>
<div class="col-lg-12">
    <form method="POST" class="login_form_" style="text-align: center;">
        {% csrf_token %}
        <div class="row">
            <div class="col-lg-12">
                <input type="text" name="username" class="username-in register" placeholder="نام کاربری" required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <input type="text" name="first_name" class="username-in reg" placeholder="نام" required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <input type="text" name="last_name" class="username-in reg_left" placeholder="نام خانوادگی" required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <input type="text" name="mobile_number" class="username-in reg" placeholder="شماره موبایل" required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <input type="text" name="email" class="username-in reg_left" placeholder="آدرس ایمیل" required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <input type="text" name="password1" class="username-in reg" placeholder="رمز عبور" required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <input type="text" name="password2" class="username-in reg_left" placeholder="تکرار رمز عبور"
                       required=""
                       id="id_Username">
            </div>
            <div class="col-lg-6">
                <button style="width: 155px;right: 0;" class="login-btn register_confirm" type="submit"> تایید شماره و ثبت نام</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
