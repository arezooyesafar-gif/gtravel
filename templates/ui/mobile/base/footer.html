<style>
.preferred-source-box{display:flex!important;flex-direction:column!important;align-items:center!important;gap:10px!important;margin:18px auto!important;padding:16px!important;background:#fff!important;border:1px solid #e5e9f0!important;border-radius:14px!important;box-shadow:0 2px 10px rgba(20,30,60,.05)!important;text-align:center!important;}
.preferred-source-box .ps-title{display:block!important;margin:0!important;font-size:14px!important;font-weight:700!important;color:#1a1d24!important;white-space:normal!important;width:auto!important;max-width:none!important;}
.preferred-source-box .ps-sub{display:block!important;margin:0!important;font-size:12px!important;color:#8b93a1!important;white-space:normal!important;width:auto!important;max-width:none!important;}
.preferred-source-box .ps-textlink{display:inline-block!important;font-size:13px!important;font-weight:600!important;color:#1d5cad!important;text-decoration:underline!important;}
.preferred-source-box .ps-btn-holder{display:none!important;width:100%!important;max-width:260px!important;min-height:44px!important;position:relative!important;}
</style>
<section class="preferred-source-box">
    <div class="ps-text">
        <p class="ps-title">آرزوی سفر را به منابع مورد علاقه خود اضافه کنید</p>
        <p class="ps-sub">با یک کلیک، تورهای محبوب آرزوی سفر را در گوگل دنبال کنید</p>
    </div>
    <a class="ps-textlink" href="https://www.google.com/preferences/source?q=arezoosafar.com" target="_blank" rel="noopener">افزودن به منابع مورد علاقه گوگل</a>
    <div class="ps-btn-holder">
        <div google-add-preferred-source-btn></div>
    </div>
</section>
<script>
(function () {
    var wrap = document.currentScript.previousElementSibling;
    if (!wrap) return;
    var link = wrap.querySelector('.ps-textlink');
    var holder = wrap.querySelector('.ps-btn-holder');
    var widget = holder ? holder.querySelector('[google-add-preferred-source-btn]') : null;
    if (!link || !holder || !widget) return;
    function reveal() {
        holder.style.setProperty('display', 'block', 'important');
        link.style.setProperty('display', 'none', 'important');
    }
    if (widget.getAttribute('data-initialized') === 'true') { reveal(); return; }
    var obs = new MutationObserver(function () {
        if (widget.getAttribute('data-initialized') === 'true') { reveal(); obs.disconnect(); }
    });
    obs.observe(widget, {attributes: true, attributeFilter: ['data-initialized']});
})();
</script>
