{% if memory_category %}
<div class="travelogue-banner">
    <a class="tvb-card" href="{% url 'memory-category' memory_category.slug %}">
        <span class="tvb-icon" aria-hidden="true">
            <svg width="39" height="39" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6.5C10.6 5.2 8.6 4.5 6 4.5H3v13h3c2.6 0 4.6.7 6 2 1.4-1.3 3.4-2 6-2h3v-13h-3c-2.6 0-4.6.7-6 2z"/>
                <path d="M12 6.5v14"/>
                <path d="M5.5 8.5h3M5.5 11.5h3M15.5 8.5h3M15.5 11.5h3"/>
            </svg>
        </span>
        <span class="tvb-text">
            <span class="tvb-title">{{ memory_category.name }}</span>
            <span class="tvb-desc">تجربه واقعی سفر مسافران، راهنمای شهرها و نکات کاربردی سفر</span>
        </span>
        <span class="tvb-cta">
            <span>مشاهده سفرنامه‌ها</span>
            <svg width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M25 9H2"/>
                <path d="M9 2 2 9l7 7"/>
            </svg>
        </span>
    </a>
</div>
{% endif %}
