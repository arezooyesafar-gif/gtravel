<html lang="en" dir="rtl">

<head>
    {% load static %}
    {% load humanize %}
    {% load jalali_tags %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/media/favicon-32x32.png">
    <link href="{% static '/asset/css/uistyle.css' %}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" rel="stylesheet">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <title>شرکت خدمات مسافرت هوایی و گردشگری آرزو سفر پارسیان | نتایج جست و جو</title>
</head>

<body>
    <div class="main-warper">
        <div class="top-container">
            {% include 'ui/topbar.html' %}
            {% include 'ui/res-menu.html' %}
            <div class="secd-row detail">
                <div class="tour-detail-title">
                    <p>پیگیری رزرواسیون<span class="hotel-name-en"></span></p>
                </div>
            </div>
        </div>
        <div class="content-container col-sm-12 col-lg-11">
            <div class="right-side order-track">
                <div class="order-container">
                    <p class="form-title">پیگیری رزرواسیون</p>
                    {% if Msg %}
                    <p class="no-reserve">{{Msg}}</p>
                    {% endif %}
                    <form method="get" novalidate>
                        <div class="mobile-input-field">
                            <input type="text" name="usermobile" class="user-mobile"
                                placeholder="شماره موبایل رزرو را وارد کنید">
                        </div>
                        <div class="tra-code-input-field">
                            <input type="text" name="usertrs" class="user-trs"
                                placeholder="کد پیگیری رزرو را وارد کنید">
                        </div>
                        <div class="tra-code-input-field">
                            <button type="submit" class="order-track-submit">پیگیری رزرواسیون</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        {% include 'ui/footer.html' %}
    </div>
    <link href="{% static 'asset/css/rsc/all.min' %}" rel="stylesheet" async>
    <link rel="stylesheet" href="{% static 'admin/jquery.ui.datepicker.jalali/themes/base/jquery-ui.min.css' %}">
    <script type="module" src="{% static 'asset/css/rsc/ionicons.esm.js' %}"></script>
    <script type="module" src="{% static 'asset/css/rsc/ionicons.js' %}"></script>
    <script src="{% static 'admin/js/django_jalali.js' %}"></script>
    <script src="{% static 'asset/css/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="/static/asset/js/convertDate.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
