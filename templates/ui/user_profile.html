<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'asset/css/style.css' %}">
    <link href="/static/asset/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <title>مشاهده و بروزرسانی پروفایل</title>
</head>
<body style="background: #F3F5FA;">
<div class="container login_page register_form">
    <div class="row">
        <div class="col-lg-4">
            <div class="login_image_ register_page">
                <div class="user_avatar">
                    <div class="avatar"></div>
                    <p class="user_full_name">{{ data.get_full_name }}</p>
                    {% for message in messages %}
                        <p {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</p>
                    {% endfor %}
                </div>

            </div>
        </div>
        <div class="col-lg-8">
            <form method="post" style="padding-left: 20px;margin-top: 20px;">
                {% csrf_token %}
                <div class="row">
                    <div class="col-lg-12">
                        <input value="{{ data.username }}" type="text" name="username" class="username-in register"
                               placeholder="نام کاربری" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <input value="{{ data.first_name }}" type="text" name="first_name" class="username-in reg"
                               placeholder="نام" required="" id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <input value="{{ data.last_name }}" type="text" name="last_name" class="username-in reg_left"
                               placeholder="نام خانوادگی" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <input value="{{ info.mobile_number }}" disabled type="text" name="mobile_number"
                               class="username-in reg" placeholder="شماره موبایل" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <input value="{{ data.email }}" type="text" name="email" class="username-in reg_left"
                               placeholder="آدرس ایمیل" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <input {% if info.provinace %}value="{{ info.provinace }}"{% endif %}
                               type="text" name="proviance" class="username-in reg" placeholder="استان" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <input name="city"
                               {% if info.city %}value="{{ info.city }}"{% endif %}
                               type="text" class="username-in reg_left" placeholder="شهر" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-12">
                        <input name="address"
                               {% if info.adress %}value="{{ info.adress }}"{% endif %}
                               type="text" class="username-in register addrs" placeholder="آدرس" required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <button class="login-btn register_confirm" type="submit">ذخیره تغییرات</button>
                    </div>
                    <div class="col-lg-6">
                        <a href="/" class="login-btn register_confirm" type="submit">بازگشت به صفحه اصلی</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
