<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'asset/css/style.css' %}">
    <link href="/static/asset/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <title>تایید شماره موبایل</title>
</head>
<body style="background: #F3F5FA;">
<div class="container login_page">
    <div class="row">
        <div class="col-lg-4">
            <div class="login_image_ otp_varify">
                <img src="/static/asset/css/images/login-img.png">
            </div>
        </div>
        <div class="col-lg-8">
            <div class="row">
                <form method="POST">
                    {% csrf_token %}
                    <div class="col-lg-12">
                        <input type="text" name="otp_code" class="username-in otp_varify" placeholder="کد اعتبار سنجی"
                               required=""
                               id="id_Username">
                    </div>
                    <div class="col-lg-6">
                        <button class="login-btn otp_varify" type="submit"> تایید کد</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
