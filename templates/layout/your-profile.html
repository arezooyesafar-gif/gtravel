<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta Tags -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="theme-color" content="" />
        <!-- Title -->
        <title>Profile</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
        <!-- Theme CSS -->
        <link rel="stylesheet" href="/static/layout/assets/css/style.css" />
        <link rel="stylesheet" href="/static/layout/assets/css/responsive.css" />
    </head>
    <body>
    {% include 'layout/header.html' %}
        <main>
            <section>
                <div class="profile-section mt-5">
                    <div class="container">
                        <form method="POST" action="{% url 'visa_panel' user_info.id %}" class="box">
                        {% csrf_token %}
                            <div class="flex">
                                <div>
                                    <div>
                                        <label for="">Surname </label>
                                        <input name="last_name" 
                                               {% if user_info.last_name %}
                                                   value="{{ user_info.last_name }}"
                                                {% endif %}
                                               type="text" class="form-control" />
                                        <p class="details">توضیحات : نام خانوادگی</p>
                                    </div>
                                </div>
                                <div>
                                    <div>
                                        <label for="">Name</label>
                                        <input name="last_name" 
                                               {% if user_info.first_name %}
                                                   value="{{ user_info.first_name }}"
                                                {% endif %}
                                                type="text" class="form-control" />
                                        <p class="details">توضیحات : نام</p>
                                    </div>
                                </div>
                                <div>
                                    <div>
                                        <label for="">Agancy name</label>
                                        <input name="last_name" 
                                               {% if profile.agancy_name %}
                                                   value="{{ profile.agancy_name }}"
                                                {% endif %} type="text" class="form-control" />
                                        <p class="details">توضیحات : نام آژانس</p>
                                    </div>
                                </div>
                                <div>
                                    <div>
                                        <label for="">Phone number</label>
                                        <input name="last_name" 
                                               {% if user_info.username %}
                                                   value="{{ user_info.username }}"
                                                {% endif %} type="text" class="form-control" />
                                        <p class="details">توضیحات : شماره موبایل</p>
                                    </div>
                                </div>
                            </div>
                            <div class="text-start">
                                <button class="btn btn-theme">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js" integrity="sha384-IDwe1+LCz02ROU9k972gdyvl+AESN10+x7tBKgc9I5HFtuNz0wWnPclzo6p9vxnk" crossorigin="anonymous"></script>
        <script src="/static/layout/assets/js/main.js"></script>
        <!-- /scripts -->
    </body>
</html>
