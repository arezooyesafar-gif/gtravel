<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <meta name="theme-color" content=""/>
    <!-- Title -->
    <title>Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous"/>
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/layout/assets/css/style.css"/>
    <script src="/static/slider/vendors/jquery.min.js"></script>
</head>
<body>
<header>
    <nav>
        <div class="top-header">
            <div class="container">
                <div>
                    <a href=""><img src="/static/layout/assets/images/logo.png" alt=""/></a>
                </div>
                <div>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="{% url 'otp_login' %}">Sign in</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="bottom-header">
            <div class="container">
                <span>Sign in</span>
            </div>
        </div>
    </nav>
</header>
<main>
    <section>
        <div class="auth-section mt-5">
            <div class="container">
                <form method="POST" class="box">
                {% csrf_token %}
                    {% for message in messages %}
                        <p class="error-body ap">{{ message }}</p>
                    {% endfor %}
                    <div class="flex">
                        <div>
                            <div class="w-100">
                                <label for="">Name <span>(نام)</span></label>
                                <input name="first_name" type="text" class="form-control"/>
                                <p class="details">توضیحات : نام به فارسی</p>
                            </div>
                        </div>
                        <div>
                            <div class="w-100">
                                <label for="">Last name <span>(نام خانوادگی)</span></label>
                                <input name="last_name" type="text" class="form-control"/>
                                <p class="details">توضیحات : نام خانوادگی به فارسی</p>
                            </div>
                        </div>
                        <div>
                            <div class="w-100">
                                <label for="">Phone number <span>(شماره موبایل)</span></label>
                                <input name="mobile_number" onkeypress="return isNumberKey(event)" type="text" class="form-control"/>
                                <p class="details">توضیحات : شماره موبایل جهت دریافت کد تایید</p>
                            </div>
                        </div>
                        <div>
                            <div class="w-100">
                                <label for="">Agency name <span>(نام آژانس)</span></label>
                                <input name="agancy_name" type="text" class="form-control"/>
                                <p class="details">توضیحات : چنانچه آژانس مسافرتی و همکار هستید نام آژانس را وارد
                                    کنید</p>
                            </div>
                        </div>
                    </div>
                    
                    <hr/>
                    <div class="text-end">
                        <button class="btn btn-theme">Sign up</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js"
        integrity="sha384-IDwe1+LCz02ROU9k972gdyvl+AESN10+x7tBKgc9I5HFtuNz0wWnPclzo6p9vxnk"
        crossorigin="anonymous"></script>
<script src="/static/layout/assets/js/main.js"></script>
<script src="/static/layout/asset/js/latin2Arabic.jquery.js"></script>
<!-- /scripts -->
</body>
</html>
