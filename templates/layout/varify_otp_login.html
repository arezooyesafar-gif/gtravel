<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <meta name="theme-color" content=""/>
    <!-- Title -->
    <title>Sign in</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous"/>
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/layout/assets/css/style.css"/>
    <link rel="stylesheet" href="/static/layout/assets/css/responsive.css"/>
</head>
<body>
<header>
    <nav>
        <div class="top-header">
            <div class="container">
                <div>
                    <a href=""><img src="/static/layout/assets/images/logo.png" alt=""/></a>
                </div>
                <div>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="">Sign in</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="bottom-header">
            <div class="container">
                <span>Sign in</span>
            </div>
        </div>
    </nav>
</header>
<main>
    <section>
        <div class="auth-section">
            <div class="container">
                <form method="POST" action="" class="box">
                    {% csrf_token %}
                    <div class="flex">
                        {% for message in messages %}
                            <p class="error-body ap">{{ message }}</p>
                        {% endfor %}
                        <div>
                            <div>
                                <label for="">Varifaction Code</label>
                                <input name="otp_user" type="text" class="form-control"/>
                                <p class="details">توضیحات : کد ارسال شده به موبایل </p>
                            </div>
                            <p>
                                please enter your varifaction code.
                            </p>
                        </div>
                    </div>
                    <a href="{% url 'create_user' %}">
                        Register as a new user
                        <span>(ثبت نام)</span>
                    </a>
                    <hr/>
                    <div class="text-end">
                        <button class="btn btn-theme">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js"
        integrity="sha384-IDwe1+LCz02ROU9k972gdyvl+AESN10+x7tBKgc9I5HFtuNz0wWnPclzo6p9vxnk"
        crossorigin="anonymous"></script>
<script src="/static/layout/assets/js/main.js"></script>
<!-- /scripts -->
</body>
</html>
