{% extends 'admin-dashboard/base/base.html' %}
{% load jalali_tags %}
{% block Main %}
    <div class="row m-t-40" style="padding-left: 0;">
        <div class="col-sm-12 col-lg-12" style="padding-left: 0;">
            <div class="card">
                <div class="card-inner border-bottom">
                    <div class="card-title-group">
                        <div class="card-title">
                            <h6 class="title">
                                لیست شهر های ثبت شده
                            </h6>
                        </div>
                        <div class="card-tools">
                            <a href="{% url 'create-city' %}" class="link">ایجاد شهر جدید </a>
                        </div>
                    </div>
                </div>
                <div class="row m-20">
                        <div class="col-lg-4">
                            <input type="text" class="text-input search-input" name="country-name" id="country-name"
                                   placeholder="نام کشور را وارد کنید">
                        </div>
                        <div class="col-lg-4">
                            <input type="text" class="text-input search-input" name="city-name" id="city-name"
                                   placeholder="نام شهر را وارد کنید">
                        </div>
                        <div class="col-lg-4">
                            <button id="searchBtn" class="btn btn-lg btn-info btn-block">جستجو</button>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    </div>

    <div class="row m-t-40">
        <div id="city_list" class="table-block">
        </div>
    </div>
{% endblock %}
