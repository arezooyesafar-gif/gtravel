{% if media_list %}
    <div class="col-lg-12">
        <div class="col-lg-12">
            <div class="country_data">
                <h6 class="title">
                    سوالات ثبت شده
                </h6>
            </div>
        </div>
        <div id="accordion" class="accordion">
            {% for media in media_list %}
                <div class="accordion-item">
                    <div class="row">
                        <div class="col-lg-11 faq_heading"><a href="#" class="accordion-head collapsed" data-bs-toggle="collapse"
                                                  data-bs-target="#accordion-item-{{ forloop.counter }}">
                            <h6 class="title">{{ media.title }}</h6>
                        </a></div>
                        <div class="col-lg-1 faq_action" {% if forloop.last %}style="border-bottom: none;"{% endif %}>
                            <div class="card">
                                <div class="dropdown" style="margin-top: 12px;">
                                <a class="text-soft dropdown-toggle btn btn-icon btn-trigger" data-bs-toggle="dropdown"><em
                                        class="icon ni ni-more-h"></em></a>
                                <div class="dropdown-menu dropdown-menu-end dropdown-menu-xs">
                                    <ul class="link-list-plain">
                                        <li><a href="{% url 'update-media-country' media.id %}">ویرایش</a></li>
                                        <li><a style="color: red" href="{% url 'delete-media-country' media.id %}">حذف</a></li>
                                    </ul>
                                </div>
                            </div>
                            </div>

                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <ul class="pagination">
            {% for n in media_list.paginator.page_range %}
                {% if n > media_list.number|add:'-10' and n < media_list.number|add:'10' %}
                    <li data-page="{{ n }}"
                        class="page-item{% if media_list.number == n %} active{% endif %}">
                        <a class="page-link">{{ n }}</a></li>
                {% endif %}
            {% endfor %}
        </ul>
    </div>
{% endif %}
