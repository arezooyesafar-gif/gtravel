<div class="col-sm-12 col-lg-6 master_post m-b-20">
    <a style="height: 310px;" class="blog_post_index" href="/russia_visa">
        <div class="main-post-img">
            <img class="post_image_index" src="{{visa_post.Image.url }}">
        </div>
        <div class="post_title_index">
            <p class="_index_title">
                {{ visa_post.Title }}
            </p>
            <p class="post_category_index_">
                {{ visa_post.Category }}
            </p>
        </div>
    </a>
</div>
<div class="col-sm-12 col-lg-6">
    <div class="row">
        {% for post in Posts %}
            {% if forloop.counter < 5 %}
                <div class="col-sm-6 col-lg-6 m-b-20">
                    <a class="blog_post_index mini_list"
                       href="{% url 'post-detail' post.id post.slug %}">
                        <div class="">
                            <img loading="lazy" class="post_image_index" src="{{ post.Image.url }}">
                        </div>
                        <div class="post_title_index">
                            <p class="_index_title mini_show">
                                {{ post.Title |truncatechars:30 }}
                            </p>
                            <p class="post_category_index_">
                                {{ post.Category }}
                            </p>
                        </div>
                    </a>
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
